# Builds the Linux AppImage. On a version tag (v*) push it publishes a GitHub
# Release; on a manual run (workflow_dispatch) it just uploads the AppImage as a
# downloadable workflow artifact — a dry run with no tag/release. Cut a release:
#   npm version <x.y.z>   # edits package.json + creates the tag
#   git push origin main --tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual dry run from the Actions tab (builds, no release)

permissions:
  contents: write # create the release and upload the AppImage asset

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 (LTS), matching .nvmrc / package.json engines and local dev.
          node-version: 24
          cache: npm
      - run: npm ci

      # Guard against a tag/package.json mismatch before the multi-minute build:
      # the tag drives the release name, package.json drives the artifact name
      # (Eupub-${version}.AppImage), so they must agree. Tag runs only — a manual
      # dry run has no tag to check.
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $pkg — bump package.json to match the tag"
            exit 1
          fi

      # dist:linux builds the engine + lexicon, then runs electron-builder
      # --linux AppImage. artifactName is Eupub-${version}.AppImage.
      - run: npm run dist:linux

      # Tag push → publish a Release with the AppImage attached.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Eupub-*.AppImage \
            --title "Eupub ${GITHUB_REF_NAME#v}" \
            --generate-notes

      # Manual dry run → no release; just hand back the built AppImage as a
      # downloadable workflow artifact so the build can be verified end to end.
      - name: Upload AppImage artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: eupub-appimage
          path: dist/Eupub-*.AppImage
          if-no-files-found: error
