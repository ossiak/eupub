# Builds the release assets. On a version tag (v*) push it publishes a GitHub
# Release; on a manual run (workflow_dispatch) it uploads each build as a
# downloadable workflow artifact instead (a dry run with no tag/release).
#
#   Linux (ubuntu-latest)   -> Eupub-<version>.AppImage
#   macOS (macos-latest)    -> Eupub-<version>-arm64.dmg, signed + notarized when
#     the signing secrets below are set, otherwise an unsigned dmg.
#   Windows (windows-latest) -> eupub-Setup-<version>.exe, Authenticode-signed
#     via Azure Artifact Signing when AZURE_CLIENT_ID is set, otherwise an
#     unsigned installer.
#   Android (ubuntu-latest) -> eupub-<version>.apk, signed when the keystore
#     secrets below are set. UNLIKE the other three, an unsigned build is never
#     attached to the release: an unsigned apk cannot be installed at all, so
#     publishing one would put a file on the Releases page that no phone accepts.
#     Without the secrets the job still builds (so forks and dry runs work) and
#     leaves the result as a workflow artifact only.
#
# The four jobs run in parallel and each attaches its own asset (create-or-upload),
# so there is no ordering dependency and a failure in one still ships the others'.
#
# Eupub reuses the euspell engine "as-is" from the sibling euspell_ext repo via
# relative imports (../../../euspell_ext/...), so BOTH repos are checked out
# side-by-side into the workspace (eupub/ and euspell_ext/), and euspell_ext is
# built first (its dist/ is gitignored). euspell_ext is private, so its checkout
# needs a token that can read it:
#   EUSPELL_EXT_TOKEN  a PAT (fine-grained: ossiak/euspell Contents:read, or a
#                      classic PAT with 'repo') stored as an Actions secret here.
#
# Cut a release (locally, in the eupub repo):
#   npm version <x.y.z>                  # edits package.json + package-lock + tag
#   git push --follow-tags origin main   # pushes the commit AND its tag together
#
# package.json is the only place a version is written. The mobile builds are not
# made here, but they read the same field: android/app/build.gradle.kts parses it
# at configuration time, and ios/Eupub/prepare-assets.mjs writes it into
# Version.xcconfig. So one `npm version` moves all five artefacts.
#
# macOS signing secrets (Settings > Secrets and variables > Actions) - all
# optional; without them the macOS job still builds an unsigned dmg. See
# docs/macos-signing.md:
#   CSC_LINK           base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD   that .p12's export password
#   APPLE_API_KEY_P8   contents of the App Store Connect AuthKey_*.p8
#   APPLE_API_KEY_ID   the key's ID
#   APPLE_API_ISSUER   the issuer UUID
#
# Windows signing secrets - also optional; without them the Windows job builds an
# unsigned installer. Signing goes through Azure Artifact Signing (account
# euspell, profile euspell-public), so there is no certificate file anywhere -
# signing is an API call and the credentials are a service principal holding the
# "Artifact Signing Certificate Profile Signer" role. See docs/windows-signing.md:
#   AZURE_TENANT_ID       directory (tenant) id
#   AZURE_CLIENT_ID       app registration client id; also the presence check
#   AZURE_CLIENT_SECRET   that app registration's client secret
# AZURE_CLIENT_ID doubles as the switch: the Configure signing step injects
# build.win.azureSignOptions only when it is set, because electron-builder cannot
# be asked to skip Azure signing once that block exists.
#
# Android signing secrets - optional in the same way, but with a sharper
# consequence (see the apk note above). Android keys are self-generated; see
# docs/android-signing.md for making the keystore and docs/android-play-submission.md
# for what distribution then requires:
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks; also the presence check
#   ANDROID_KEYSTORE_PASSWORD the store password
#   ANDROID_KEY_ALIAS         the key alias (eupub)
#   ANDROID_KEY_PASSWORD      the key password
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual dry run from the Actions tab (builds, no release)

permissions:
  contents: write # create the release and upload assets

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out eupub
        uses: actions/checkout@v5
        with:
          path: eupub
      - name: Check out euspell_ext (sibling engine source)
        uses: actions/checkout@v5
        with:
          repository: ossiak/euspell
          path: euspell_ext
          token: ${{ secrets.EUSPELL_EXT_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          # 24 (LTS), matching .nvmrc / package.json engines and local dev.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            eupub/package-lock.json
            euspell_ext/package-lock.json

      # euspell_ext's dist/ is gitignored; build it so its src/content/
      # lexicon-source.js (which Eupub's engine bundle imports) can load
      # dist/lexicon.js + friends.
      - name: Build euspell_ext (engine + lexicon)
        working-directory: euspell_ext
        run: npm ci && npm run build

      - name: Install Eupub deps
        working-directory: eupub
        run: npm ci

      # Guard against a tag/package.json mismatch before the multi-minute build:
      # the tag drives the release name, package.json drives the artifact name.
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        working-directory: eupub
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $pkg -- bump package.json to match the tag"
            exit 1
          fi

      # dist:linux passes --publish never (see package.json) so electron-builder
      # never auto-publishes on CI; the workflow publishes explicitly below.
      - name: Build AppImage
        working-directory: eupub
        run: npm run dist:linux

      - name: Publish release
        if: github.ref_type == 'tag'
        working-directory: eupub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Eupub-*.AppImage \
            --title "Eupub ${GITHUB_REF_NAME#v}" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" release/Eupub-*.AppImage --clobber

      - name: Upload AppImage artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: eupub-appimage
          path: eupub/release/Eupub-*.AppImage
          if-no-files-found: error

  dmg:
    runs-on: macos-latest # Apple Silicon runner, matching the --arm64 target
    steps:
      - name: Check out eupub
        uses: actions/checkout@v5
        with:
          path: eupub
      - name: Check out euspell_ext (sibling engine source)
        uses: actions/checkout@v5
        with:
          repository: ossiak/euspell
          path: euspell_ext
          token: ${{ secrets.EUSPELL_EXT_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            eupub/package-lock.json
            euspell_ext/package-lock.json

      - name: Build euspell_ext (engine + lexicon)
        working-directory: euspell_ext
        run: npm ci && npm run build

      - name: Install Eupub deps
        working-directory: eupub
        run: npm ci

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        working-directory: eupub
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $pkg -- bump package.json to match the tag"
            exit 1
          fi

      # Configure code signing from secrets. With a Developer ID cert (CSC_LINK)
      # the app is signed; without it we set CSC_IDENTITY_AUTO_DISCOVERY=false so
      # electron-builder builds an UNSIGNED dmg rather than choking on an empty
      # CSC_LINK. With a notary key (APPLE_API_KEY_ID) it also notarizes.
      - name: Configure signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            # Heredoc: a base64 .p12 is often line-wrapped, so it can't go on one line.
            {
              echo "CSC_LINK<<__CSCEOF__"
              echo "$CSC_LINK"
              echo "__CSCEOF__"
            } >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing cert configured -- building an unsigned dmg."
          fi
          if [ -n "$APPLE_API_KEY_ID" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            node -e "const f='eupub/package.json',p=require('./'+f);p.build.mac.notarize=true;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          fi

      - name: Build dmg
        working-directory: eupub
        run: npm run dist:mac

      # electron-builder (above) notarizes + staples the .app, but not the .dmg
      # wrapper — so a downloaded dmg still trips Gatekeeper on open even though the
      # app inside is clean. Notarize and staple the dmg itself (its app is already
      # notarized, so this pass is quick) so the download opens with no prompt.
      # Reuses the API-key creds the "Configure signing" step put in the env.
      - name: Notarize and staple the dmg
        if: env.APPLE_API_KEY_ID != ''
        working-directory: eupub
        run: |
          dmg=$(ls release/Eupub-*-arm64.dmg)
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Publish release
        if: github.ref_type == 'tag'
        working-directory: eupub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Eupub-*-arm64.dmg \
            --title "Eupub ${GITHUB_REF_NAME#v}" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" release/Eupub-*-arm64.dmg --clobber

      - name: Upload dmg artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: eupub-dmg
          path: eupub/release/Eupub-*-arm64.dmg
          if-no-files-found: error

  apk:
    runs-on: ubuntu-latest # the runner image ships the Android SDK; no extra setup
    steps:
      - name: Check out eupub
        uses: actions/checkout@v5
        with:
          path: eupub
      - name: Check out euspell_ext (sibling engine source)
        uses: actions/checkout@v5
        with:
          repository: ossiak/euspell
          path: euspell_ext
          token: ${{ secrets.EUSPELL_EXT_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            eupub/package-lock.json
            euspell_ext/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17 # matches compileOptions/kotlinOptions in build.gradle.kts

      - name: Build euspell_ext (engine + lexicon)
        working-directory: euspell_ext
        run: npm ci && npm run build

      - name: Install Eupub deps
        working-directory: eupub
        run: npm ci

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        working-directory: eupub
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $pkg -- bump package.json to match the tag"
            exit 1
          fi

      # The build reads android/keystore.properties if it exists and silently
      # produces an unsigned apk if it does not (see build.gradle.kts), which is
      # what keeps forks and dry runs working. ANDROID_KEYSTORE_BASE64 is the
      # switch, mirroring AZURE_CLIENT_ID in the Windows job.
      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No Android keystore configured -- building an unsigned apk (it will not be published)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eupub.jks"
          cat > eupub/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/eupub.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # prepare-assets.mjs stages the renderer, engine, lexicon.db and PDF viewer
      # into app/src/main/assets/. Those are gitignored derived files, so a build
      # that skips this step compiles happily and ships the previous reader.
      - name: Build the apk
        working-directory: eupub
        run: |
          npm run build
          node android/prepare-assets.mjs
          cd android && ./gradlew --no-daemon assembleRelease

      # Signed or not is decided by the build, not by us, so read it back off the
      # artifact rather than inferring it from whether a secret was set.
      - name: Verify the signature and name the file
        id: apk
        working-directory: eupub
        run: |
          version="$(node -p "require('./package.json').version")"
          out=android/app/build/outputs/apk/release
          src="$(ls "$out"/*.apk | head -1)"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          if "$apksigner" verify --print-certs "$src" > certs.txt 2>&1; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            grep -E 'SHA-256 digest|certificate DN' certs.txt || true
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apk is unsigned -- it will not be attached to the release."
          fi
          cp "$src" "$out/eupub-$version.apk"
          echo "path=$out/eupub-$version.apk" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref_type == 'tag' && steps.apk.outputs.signed == 'true'
        working-directory: eupub
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Eupub ${GITHUB_REF_NAME#v}" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" "$APK" --clobber

      - name: Upload apk artifact
        uses: actions/upload-artifact@v6
        with:
          name: eupub-apk
          path: eupub/android/app/build/outputs/apk/release/eupub-*.apk
          if-no-files-found: error

  nsis:
    runs-on: windows-latest # signtool.exe is a Windows tool; no cross-signing here
    steps:
      - name: Check out eupub
        uses: actions/checkout@v5
        with:
          path: eupub
      - name: Check out euspell_ext (sibling engine source)
        uses: actions/checkout@v5
        with:
          repository: ossiak/euspell
          path: euspell_ext
          token: ${{ secrets.EUSPELL_EXT_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            eupub/package-lock.json
            euspell_ext/package-lock.json

      - name: Build euspell_ext (engine + lexicon)
        working-directory: euspell_ext
        run: npm ci && npm run build

      - name: Install Eupub deps
        working-directory: eupub
        run: npm ci

      # Same guard as the other jobs, in PowerShell (windows-latest runs `run:`
      # steps under pwsh).
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        working-directory: eupub
        run: |
          $pkg = "v" + (node -p "require('./package.json').version")
          if ($pkg -ne $env:GITHUB_REF_NAME) {
            echo "::error::tag $env:GITHUB_REF_NAME != package.json $pkg -- bump package.json to match the tag"
            exit 1
          }

      # azureSignOptions is injected here rather than committed to package.json,
      # and that is the whole reason this step exists. electron-builder picks its
      # signing manager purely on the presence of that block (winPackager.ts), with
      # no check that credentials exist — so a committed block would make an
      # unsigned Windows build impossible, and every run without the secrets (a
      # fork, a PR, the non-tag dry run below) would fail instead of producing an
      # unsigned installer. Absent, the signtool manager takes over and skips
      # signing when no certificate is configured, which is the behaviour we want
      # as the default. Same shape as the dmg job's notarize=true patch above.
      - name: Configure signing
        working-directory: eupub
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if ($env:AZURE_CLIENT_ID) {
            node -e "const f='package.json',p=require('./'+f);p.build.win.azureSignOptions={publisherName:'Kamran Ossia',endpoint:'https://wus2.codesigning.azure.net',codeSigningAccountName:'euspell',certificateProfileName:'euspell-public'};require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            echo "Azure Artifact Signing configured (account euspell, profile euspell-public)."
          } else {
            echo "No Azure credentials configured -- building an unsigned installer."
          }

      - name: Build installer
        working-directory: eupub
        env:
          # Read by Azure's EnvironmentCredential inside the TrustedSigning module.
          # Ignored entirely when the step above left azureSignOptions unset.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run dist

      - name: Publish release
        if: github.ref_type == 'tag'
        working-directory: eupub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Eupub " + ($env:GITHUB_REF_NAME -replace '^v', '')
          gh release create "$env:GITHUB_REF_NAME" (Get-Item release/eupub-Setup-*.exe) --title "$title" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            gh release upload "$env:GITHUB_REF_NAME" (Get-Item release/eupub-Setup-*.exe) --clobber
          }

      - name: Upload installer artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: eupub-nsis
          path: eupub/release/eupub-Setup-*.exe
          if-no-files-found: error
